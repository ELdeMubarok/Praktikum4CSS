<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>form sembako</h2>
    <input id="nama" type="text" placeholder="Ketik Nama Anda">
    <p id="pesan">silahkan isi nama Anda</p>

    <script>
        const inputnama = document.querySelector("#nama");
        const pesan = document.querySelector("#pesan");

        function TampilkanPesan() {
            const nama = inputnama.value.trim();
            pesan.textContent = nama === "" ?
            'silahkan isi nama anda' : "selamat anda mendapatkan sembako atas nama  "
            + nama + "!";
        }
        inputnama.addEventListener("input", TampilkanPesan);
    </script>
    
</body>
</html>
