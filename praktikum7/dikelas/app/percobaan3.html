<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2 id="judul">selamat datang</h2>
    <button id="btnUbah">Ubah Tampilan</button>
    
    <script>
        function ubahTampilan() {
            const judul = document.getElementById("judul");
            judul.textContent = "Belajar Dom js ASYIKKK CUYYY";
            judul.style.color = "purple";
    
        }

        document.getElementById("btnUbah").addEventListener("click", ubahTampilan);
    </script>
</body>
</html>
